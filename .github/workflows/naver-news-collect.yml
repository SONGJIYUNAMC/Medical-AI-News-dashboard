name: naver-news-collect

on:
  schedule:
    # 깃허브 예약 실행은 대기열 사정으로 1~3시간씩 늦게 시작된다(최근 기록 기준).
    # 그래서 새벽에 미리 돌려 출근 전에 끝나 있게 하고, 아침에 한 번 더 보충 수집한다.
    # 여러 번 돌아도 같은 기사는 중복 저장되지 않고, 바뀐 게 없으면 커밋도 하지 않는다.
    - cron: "13 16 * * *"   # UTC 16:13 = KST 01:13
    - cron: "13 17 * * *"   # UTC 17:13 = KST 02:13
    - cron: "13 18 * * *"   # UTC 18:13 = KST 03:13
    - cron: "13 19 * * *"   # UTC 19:13 = KST 04:13
    - cron: "13 21 * * *"   # UTC 21:13 = KST 06:13 (아침 기사 보충)
  workflow_dispatch:

permissions:
  contents: write

# 여러 수집이 동시에 돌면 서로 밀어내며 push 가 실패하므로 한 번에 하나만 실행
concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect Naver news (국내)
        env:
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
        run: python naver_news.py --hours 26 --out data/news.json
      - name: Collect Google News (해외)
        continue-on-error: true   # 해외 수집이 실패해도 국내 결과는 저장
        run: python global_news.py --config global_keywords.json --hours 48 --out data/global_news.json
      - name: Collect 정부 발표 (부처 보도자료)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python gov_news.py --config gov_sources.json --out data/gov_news.json
      - name: Collect 주요 일간지 (조선·중앙·동아·한겨레·경향·한국)
        continue-on-error: true
        run: python press_news.py --config press_sources.json --hours 24 --out data/press_news.json
      - name: 주간 누적 저장 (data/weeks)
        if: always()
        run: python archive.py
      - name: 월간 집계 (data/months)
        if: always()
        run: python monthly.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          [ -f data/global_news.json ] && git add data/global_news.json || true
          [ -f data/gov_news.json ] && git add data/gov_news.json || true
          [ -f data/press_news.json ] && git add data/press_news.json || true
          git add data/weeks
          git add data/months || true
          if git diff --staged --quiet; then echo "변경 사항 없음 - 커밋 생략"; exit 0; fi
          git commit -m "chore: update news data"
          # 그 사이 저장소가 바뀌었으면(다른 수집·직접 수정) 받아서 다시 올린다
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then echo "푸시 완료"; exit 0; fi
            echo "푸시 재시도 $i"; sleep $((i * 10))
          done
          echo "푸시 실패"; exit 1
