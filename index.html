<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의료 AI 뉴스 모니터링</title>
<style>
  :root {
    --navy: #1f3a5f; --teal: #2a7f9e; --bg: #f5f7fa; --card: #ffffff;
    --text: #1d2733; --muted: #64707d; --line: #dde3ea; --chip: #e8f1f6;
    --head-bg: #1f3a5f; --head-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141a22; --card: #1c2531; --text: #e6ebf1; --muted: #93a0ae; --line: #2c3745; --chip: #22364a; --head-bg: #1f3a5f; --head-text: #ffffff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Malgun Gothic", "맑은 고딕", -apple-system, "Segoe UI", sans-serif; line-height: 1.55; }
  header { background: var(--head-bg); color: var(--head-text); padding: 20px 16px; }
  .wrap { max-width: 960px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  .controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 6px 12px;
         border-radius: 16px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .region .tab { font-weight: 700; border-radius: 8px; padding: 7px 16px; }
  .tab.active { background: var(--teal); border-color: var(--teal); color: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input[type=search] { flex: 1 1 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                       background: var(--card); color: var(--text); font-family: inherit; font-size: 14px; }
  select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
           color: var(--text); font-family: inherit; font-size: 14px; }
  .chip.score { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  label.toggle { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .meta { font-size: 13px; color: var(--muted); padding: 10px 16px 0; }
  .notice { margin: 10px 16px 0; padding: 10px 12px; border-radius: 8px; font-size: 13px;
            background: #fff4e5; color: #7a4a00; border: 1px solid #f3d19e; }
  main { padding: 12px 16px 40px; }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  article h2 { margin: 0 0 6px; font-size: 16px; }
  article h2 a { color: var(--navy); text-decoration: none; }
  @media (prefers-color-scheme: dark) { article h2 a { color: #9cc7e0; } }
  article h2 a:hover { text-decoration: underline; }
  article p { margin: 0 0 8px; font-size: 14px; color: var(--text); }
  .foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .chip { background: var(--chip); color: var(--teal); padding: 1px 8px; border-radius: 10px; }
  details.trend { margin: 10px 16px 0; font-size: 13px; }
  details.trend summary { cursor: pointer; color: var(--muted); }
  .trend table { border-collapse: collapse; margin-top: 8px; width: 100%; background: var(--card); }
  .trend th, .trend td { border: 1px solid var(--line); padding: 4px 8px; text-align: right; white-space: nowrap; }
  .trend th:first-child, .trend td:first-child { text-align: left; white-space: normal; }
  .trend th { background: var(--chip); }
  .trend { overflow-x: auto; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>의료 AI 뉴스 모니터링</h1>
  <p>AI혁신지원팀 · 뉴스 검색 자동 수집</p>
</div></header>

<div class="controls"><div class="wrap">
  <div class="tabs region" id="regions"></div>
  <div class="tabs" id="tabs"></div>
  <div class="row">
    <select id="period" aria-label="기간"></select>
    <select id="day" aria-label="수집일"><option value="전체">전체 수집일</option></select>
    <input type="search" id="q" placeholder="제목·요약 검색">
    <select id="sort" aria-label="정렬">
      <option value="score">관련도순</option>
      <option value="date">최신순</option>
    </select>
    <label class="toggle"><input type="checkbox" id="rel"> 의료·병원·헬스 관련어 포함 기사만</label>
    <label class="toggle"><input type="checkbox" id="aiT"> 제목에 AI 포함 기사만</label>
    <button class="tab" id="csv" type="button">CSV 내려받기</button>
  </div>
</div></div>

<div class="wrap">
  <div class="meta" id="meta">불러오는 중…</div>
  <div id="notice"></div>
  <details class="trend" id="trendBox"><summary>기간 요약 (카테고리별 건수)</summary><div id="trend"></div></details>
  <main id="list"></main>
</div>

<script>
const REL = /의료|병원|헬스|환자|진료|임상|의사|간호|보건|의약|바이오|건강|health|hospital|clinic|medical|patient/i;
const AI_T = /(^|[^A-Za-z])AI(?![A-Za-z])|인공지능|딥러닝|머신러닝|생성형|LLM|언어\s?모델|챗\s?GPT|파운데이션\s?모델|디지털의료기기/i;
const state = { items: [], order: [], period: "", day: "전체", weeksLoaded: [], manifest: null, region: "국내", cat: "전체", q: "", rel: false, aiT: false, sort: "score" };
const $ = id => document.getElementById(id);

function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric",
    hour: "2-digit", minute: "2-digit", hour12: false }) + " KST";
}
function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : "#"; }
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } }

function el(tag, props, children) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  (children || []).forEach(c => e.append(c));
  return e;
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  const rows = state.items.filter(it => {
    if (regionOf(it) !== state.region) return false;
    if (state.day !== "전체" && it.first_seen !== state.day) return false;
    if (state.cat !== "전체" && it.category !== state.cat) return false;
    const text = (it.title + " " + it.summary);
    if (state.rel && !REL.test(text)) return false;
    if (state.aiT && !AI_T.test(it.title)) return false;
    if (q && !text.toLowerCase().includes(q)) return false;
    return true;
  });
  const byDate = (a, b) => (a.pubDate < b.pubDate ? 1 : a.pubDate > b.pubDate ? -1 : 0);
  rows.sort(state.sort === "date" ? byDate : (a, b) => ((b.score || 0) - (a.score || 0)) || byDate(a, b));
  return rows;
}

const regionOf = it => (it.gov ? "정부" : it.global ? "해외" : "국내");
const REGION_LABEL = { "국내": "국내 뉴스 (네이버)", "해외": "해외 뉴스 (Google News)", "정부": "정부 발표 (부처 보도자료)" };

function renderTabs() {
  const rbox = $("regions");
  rbox.replaceChildren();
  ["국내", "해외", "정부"].forEach(r => {
    const n = state.items.filter(it => regionOf(it) === r).length;
    const b = el("button", { className: "tab" + (r === state.region ? " active" : ""), type: "button",
                             textContent: `${REGION_LABEL[r]} ${n.toLocaleString()}` });
    b.onclick = () => { state.region = r; state.cat = "전체"; render(); };
    rbox.append(b);
  });
  const inRegion = state.items.filter(it => regionOf(it) === state.region);
  const counts = {};
  inRegion.forEach(it => counts[it.category] = (counts[it.category] || 0) + 1);
  const known = state.order.filter(c => counts[c]);
  const extra = Object.keys(counts).filter(c => !state.order.includes(c));
  const cats = ["전체", ...known, ...extra];
  const box = $("tabs");
  box.replaceChildren();
  cats.forEach(c => {
    const n = c === "전체" ? inRegion.length : counts[c];
    const b = el("button", { className: "tab" + (c === state.cat ? " active" : ""), type: "button",
                             textContent: `${c} ${n.toLocaleString()}` });
    b.onclick = () => { state.cat = c; render(); };
    box.append(b);
  });
}

function render() {
  renderTabs();
  const rows = filtered();
  const list = $("list");
  list.replaceChildren();
  if (!rows.length) { list.append(el("div", { className: "empty", textContent: "조건에 맞는 기사가 없습니다." })); return; }
  rows.forEach(it => {
    const a = el("a", { href: safeUrl(it.originallink || it.link), target: "_blank", rel: "noopener noreferrer", textContent: it.title });
    const foot = el("div", { className: "foot" }, [
      el("span", { className: "chip", textContent: it.category }),
      ...(it.gov ? [el("span", { className: "chip score", textContent: it.kind })]
        : [el("span", { className: "chip score", textContent: "관련도 " + (it.score ?? 0) }),
           el("span", { textContent: "검색어: " + (it.queries ? it.queries.join(", ") : it.query) })]),
      el("span", { textContent: it.gov ? it.agency : it.global ? (it.sources || []).join(", ") + " (Google News)" : host(it.originallink || it.link) }),
      ...(it.source_type === "major" ? [el("span", { className: "chip", textContent: "주요 일간지" })]
        : it.source_type === "medical" ? [el("span", { className: "chip", textContent: "의료 전문지" })]
        : it.source_type === "global_pref" ? [el("span", { className: "chip", textContent: "주요 매체" })] : []),
      ...(it.similar_count ? [el("span", { className: "chip score", title: (it.similar_sources || []).join(", "),
        textContent: "유사 기사 " + it.similar_count + "건" })] : []),
      el("span", { textContent: fmtDate(it.pubDate) }),
      ...(it.first_seen ? [el("span", { className: "chip score", textContent: "수집 " + it.first_seen.slice(5) })] : []),
    ]);
    list.append(el("article", {}, [el("h2", {}, [a]), (it.summary ? el("p", { textContent: it.summary }) : ""), foot]));
  });
}

const getJson = u => fetch(u, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
function legacyLoad() {
  return Promise.allSettled([getJson("data/news.json"), getJson("data/global_news.json"), getJson("data/gov_news.json")]).then(([kr, gl, gv]) => {
  if (kr.status !== "fulfilled") throw new Error(kr.reason.message);
  const d = kr.value;
  state.items = d.items || [];
  state.order = (d.category_order || []).slice();
  let extra = "";
  if (gl.status === "fulfilled") {
    const g = gl.value;
    (g.items || []).forEach(it => {
      state.items.push({ ...it, summary: "", global: true, originallink: it.link,
        queries: it.queries, source_type: it.preferred ? "global_pref" : "" });
    });
    (g.category_order || []).forEach(c => { if (!state.order.includes(c)) state.order.push(c); });
    extra = ` · 해외(Google News) ${(g.count || 0).toLocaleString()}건`;
    if (g.errors && g.errors.length)
      $("notice").append(el("div", { className: "notice",
        textContent: `해외 검색어 ${g.errors.length}건 수집 실패: ` + g.errors.map(e => e.query).join(", ") }));
  }
  if (gv.status === "fulfilled") {
    const v = gv.value;
    (v.items || []).forEach(it => {
      state.items.push({ ...it, gov: true, category: it.agency, originallink: it.link, score: 0,
        queries: [it.kind], source_type: "" });
    });
    (v.category_order || []).forEach(c => { if (!state.order.includes(c)) state.order.push(c); });
    extra += ` · 정부 발표(최근 ${Math.round((v.window_hours || 168) / 24)}일) ${(v.count || 0).toLocaleString()}건`;
    if (v.errors && v.errors.length)
      $("notice").append(el("div", { className: "notice",
        textContent: `정부 발표 출처 ${v.errors.length}곳 수집 실패(주소 확인 필요): ` + v.errors.map(e => e.query.split(" (")[0]).join(", ") }));
  }
  $("meta").textContent = `수집 시각 ${fmtDate(d.generated_at)} · 국내 최근 ${d.window_hours}시간 ${d.count.toLocaleString()}건${extra}`;
  if (d.errors && d.errors.length) {
    $("notice").append(el("div", { className: "notice",
      textContent: `일부 검색어(${d.errors.length}개) 수집에 실패했습니다: ` + d.errors.map(e => e.query).join(", ") }));
  }
  render();
}).catch(e => { $("meta").textContent = "데이터를 불러오지 못했습니다 (" + e.message + "). data/news.json이 있는지 확인해 주세요."; });
}

const weekLabel = w => `${w.week} (${(w.start || "").slice(5).replace("-", "/")}~${(w.end || "").slice(5).replace("-", "/")}, ${w.count.toLocaleString()}건)`;

function buildPeriods() {
  const ws = state.manifest;               // 최신 주가 앞
  const sel = $("period");
  sel.replaceChildren();
  const opts = [[`n:1`, "이번 주(최신 주)"], [`n:2`, "최근 2주"], [`n:4`, "최근 4주(월간)"], [`n:8`, "최근 8주"]];
  opts.forEach(([v, t]) => sel.append(el("option", { value: v, textContent: t })));
  ws.forEach(w => sel.append(el("option", { value: "w:" + w.week, textContent: weekLabel(w) })));
  sel.value = state.period || "n:1";
  state.period = sel.value;
}

function weeksFor(period) {
  const ws = state.manifest.map(w => w.week);
  if (period.startsWith("w:")) return [period.slice(2)];
  return ws.slice(0, parseInt(period.slice(2), 10));
}

function buildTrend(files) {
  const single = files.length === 1;
  const cols = single ? [...new Set(state.items.map(i => i.first_seen))].sort() : files.map(f => f.week).sort();
  const colOf = it => single ? it.first_seen : it._week;
  const rows = {};
  state.items.forEach(it => {
    const k = regionOf(it) + " · " + it.category;
    (rows[k] = rows[k] || {})[colOf(it)] = ((rows[k] || {})[colOf(it)] || 0) + 1;
  });
  const t = el("table", {}, []);
  t.append(el("tr", {}, [el("th", { textContent: "구분 · 카테고리" }), ...cols.map(c => el("th", { textContent: single ? c.slice(5) : c })), el("th", { textContent: "합계" })]));
  Object.keys(rows).sort().forEach(k => {
    const tot = cols.reduce((a, c) => a + (rows[k][c] || 0), 0);
    t.append(el("tr", {}, [el("td", { textContent: k }), ...cols.map(c => el("td", { textContent: rows[k][c] || "" })), el("td", { textContent: tot })]));
  });
  $("trend").replaceChildren(t);
  $("trendBox").style.display = state.items.length ? "" : "none";
}

async function loadPeriod() {
  const wk = weeksFor(state.period);
  const res = await Promise.allSettled(wk.map(w => getJson(`data/weeks/${w}.json`)));
  const files = res.filter(r => r.status === "fulfilled").map(r => r.value);
  state.items = []; state.order = [];
  files.forEach(f => {
    (f.items || []).forEach(it => state.items.push({ ...it, _week: f.week, gov: it.region === "정부", global: it.region === "해외" }));
    (f.category_order || []).forEach(c => { if (!state.order.includes(c)) state.order.push(c); });
  });
  const days = [...new Set(state.items.map(i => i.first_seen).filter(Boolean))].sort().reverse();
  const dsel = $("day");
  dsel.replaceChildren(el("option", { value: "전체", textContent: "전체 수집일" }),
    ...days.map(d => el("option", { value: d, textContent: d })));
  state.day = "전체"; state.cat = "전체";
  const f0 = files.slice().sort((a, b) => (b.updated_at || "").localeCompare(a.updated_at || ""))[0];
  $("meta").textContent = `기간 ${wk.length === 1 ? wk[0] : wk[wk.length - 1] + " ~ " + wk[0]} · 누적 ${state.items.length.toLocaleString()}건` +
    (f0 ? ` · 마지막 갱신 ${fmtDate(f0.updated_at)}` : "");
  buildTrend(files);
  render();
}

function showRunNotices(lr) {
  $("notice").replaceChildren();
  Object.entries(lr || {}).forEach(([r, v]) => {
    if (v.errors && v.errors.length)
      $("notice").append(el("div", { className: "notice",
        textContent: `[${r}] 마지막 수집에서 ${v.errors.length}건 실패: ` + v.errors.join(", ") }));
  });
}

function toCsv() {
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const head = ["수집일", "발행일", "구분", "카테고리", "제목", "출처", "링크", "관련도", "요약"];
  const lines = filtered().map(it => [it.first_seen, (it.pubDate || "").slice(0, 10), regionOf(it), it.category, it.title,
    it.gov ? it.agency : it.global ? (it.sources || []).join("/") : host(it.originallink || it.link),
    it.originallink || it.link, it.score ?? "", it.summary].map(q).join(","));
  const blob = new Blob(["\ufeff" + [head.map(q).join(","), ...lines].join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = el("a", { href: URL.createObjectURL(blob), download: `news_${state.period.replace(":", "-")}_${state.region}.csv` });
  document.body.append(a); a.click(); a.remove();
}

getJson("data/weeks/index.json").then(m => {
  state.manifest = (m.weeks || []).slice().reverse();
  if (!state.manifest.length) throw new Error("empty");
  showRunNotices(m.last_run);
  buildPeriods();
  return loadPeriod();
}).catch(() => legacyLoad());

$("period").addEventListener("change", e => { state.period = e.target.value; loadPeriod(); });
$("day").addEventListener("change", e => { state.day = e.target.value; render(); });
$("csv").addEventListener("click", toCsv);
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("rel").addEventListener("change", e => { state.rel = e.target.checked; render(); });
$("aiT").addEventListener("change", e => { state.aiT = e.target.checked; render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
</script>
</body>
</html>
